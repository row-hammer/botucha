[project]
name = "botucha"
version = "0.1.0"
description = "Botucha: a local Telegram group bot with memory"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.33,<4",
    "numpy>=2.5.5",
    "ollama>=0.6,<0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["botucha"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
